syntax = "proto3";

// Runtime maps: compiled by tool-maps from the text maps in lib-maps (docs/maps.md), one file
// per map and side. Generated output, never edited by hand.
package pokeuniverse.map.v1;

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/map/v1;mapv1";

// What spa-pokeuniverse draws: the visual layers only.
message ClientMap {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  // Tileset art to draw with, by ID (each art style maps it to its images).
  string tileset = 4;
  // One tile index per cell, row by row.
  repeated uint32 tiles = 5;
  // Tiles repeated outside the map where no connection is drawn, row by row.
  uint32 border_width = 6;
  repeated uint32 border = 7;
  repeated Connection connections = 8;
  string music = 9;
  string weather = 10;
  bool show_name = 11;
  // What the client needs to predict the player's steps, laid out as in ServerMap
  // (mic-core still checks every step).
  bytes walkable = 12;
  bytes elevation = 13;
  repeated TileBehavior behaviors = 14;
  // The people standing on the map: drawn, and blocking steps.
  repeated ClientNpc npcs = 15;
  // The cells with a warp: standing on one and going its way asks mic-core to warp (UseWarp).
  repeated WarpCell warps = 16;
  // The map's region (lib-maps `region`): names its place, e.g. in the save window.
  string region = 17;
}

message WarpCell {
  uint32 x = 1;
  uint32 y = 2;
}

// An NPC as the client draws it (its script stays on the server).
message ClientNpc {
  // The object's ID in the map.
  string id = 1;
  uint32 x = 2;
  uint32 y = 3;
  // Object event art, by ID (each art style maps it to its images).
  string sprite = 4;
  // Where it faces as the map loads.
  Direction facing = 5;
}

// What mic-core plays: collision, behaviors, warps and objects.
message ServerMap {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  MapType type = 4;
  // One entry per cell, row by row: 1 when it can be walked on, else 0.
  bytes walkable = 5;
  // One entry per cell: 0-15; 0 and 15 connect every elevation.
  bytes elevation = 6;
  repeated TileBehavior behaviors = 7;
  // One entry per cell.
  repeated EncounterType encounters = 8;
  repeated Connection connections = 9;
  repeated Warp warps = 10;
  repeated MapObject objects = 11;
  bool allow_running = 12;
  bool allow_cycling = 13;
  bool allow_escaping = 14;
  bool requires_flash = 15;
  string region = 16;
  // The map's wild Pokémon (lib-maps `encounters:`); unset when it has none.
  WildEncounters wild = 17;
}

// One table per encounter kind; a kind is unset when the map has none. The slot chances are
// FireRed's, kept in mic-core's code, not here.
message WildEncounters {
  // 12 slots.
  WildTable land = 1;
  // 5 slots.
  WildTable water = 2;
  // 5 slots.
  WildTable rock_smash = 3;
  // 10 slots: old rod 0-1, good rod 2-4, super rod 5-9.
  WildTable fishing = 4;
}

message WildTable {
  // FireRed's encounter rate (0-255 in its data).
  uint32 rate = 1;
  repeated WildSlot slots = 2;
}

message WildSlot {
  // National Pokédex number.
  uint32 species = 1;
  uint32 min_level = 2;
  uint32 max_level = 3;
}

enum MapType {
  MAP_TYPE_UNSPECIFIED = 0;
  MAP_TYPE_TOWN = 1;
  MAP_TYPE_ROUTE = 2;
  MAP_TYPE_INDOOR = 3;
  MAP_TYPE_UNDERGROUND = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_NORTH = 1;
  DIRECTION_SOUTH = 2;
  DIRECTION_WEST = 3;
  DIRECTION_EAST = 4;
}

// Another map joined along one edge; offset shifts it along that edge, in tiles.
message Connection {
  Direction direction = 1;
  string map = 2;
  int32 offset = 3;
}

message Warp {
  string id = 1;
  uint32 x = 2;
  uint32 y = 3;
  // Destination map, or empty for a dynamic warp (the map the player came from).
  string to_map = 4;
  // Warp of the destination map the player appears on.
  string to_warp = 5;
}

message MapObject {
  string id = 1;
  uint32 x = 2;
  uint32 y = 3;
  oneof kind {
    Npc npc = 4;
    Sign sign = 5;
    HiddenItem hidden_item = 6;
    Trigger trigger = 7;
  }
}

message Npc {
  string sprite = 1;
  string movement = 2;
  uint32 range_x = 3;
  uint32 range_y = 4;
  string script = 5;
  // Story flag that hides it while set; empty when always shown.
  string flag = 6;
  // Set for trainers: how they spot the player.
  string trainer_type = 7;
  uint32 trainer_sight = 8;
}

// A spot checked with A (signs, PCs, shelves).
message Sign {
  string script = 1;
  // Direction the player must face; unspecified for any.
  Direction facing = 2;
}

message HiddenItem {
  string item = 1;
  uint32 quantity = 2;
  string flag = 3;
  // Found by standing on it rather than facing it.
  bool underfoot = 4;
}

// Runs its script when the player steps on it while the variable has the value.
message Trigger {
  string script = 1;
  string var = 2;
  int32 value = 3;
}

enum EncounterType {
  ENCOUNTER_TYPE_UNSPECIFIED = 0;
  ENCOUNTER_TYPE_LAND = 1;
  ENCOUNTER_TYPE_WATER = 2;
}

