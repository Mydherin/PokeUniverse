syntax = "proto3";

// Dev-only payloads (phase-8 D16), sent as Protocol Buffers JSON. The endpoint exists only
// while mic-core has BOTS_SECRET set, never in production.
package pokeuniverse.dev.v1;

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/dev/v1;devv1";

// Request of POST /api/dev/bots: bot accounts bot-1 … bot-<count>, created or reused.
message SpawnBots {
  // 1 to 100.
  uint32 count = 1;
  // Map the bots' new trainers start on, at walkable tiles spread over it.
  string map = 2;
  // Only issue new access tokens for the bots' existing trainers (a running bot script
  // renews its tokens before they expire); nothing else changes.
  bool refresh_only = 3;
  // The first bot's n (0 or 1: bot-1), so several bot scripts can run side by side without
  // taking each other's bots over: bot-<first> … bot-<first+count-1>. Up to 1000.
  uint32 first = 4;
}

// Response of POST /api/dev/bots.
message SpawnedBots {
  repeated SpawnedBot bots = 1;
}

message SpawnedBot {
  // 1 … count: bot-<n>, trainer BOT<n>.
  uint32 n = 1;
  uint64 account_id = 2;
  string access_token = 3;
  // Unix seconds.
  int64 expires_at = 4;
}

// Response of GET /api/dev/stats (phase-8 M8): what the replica that answered measured in its
// last 10 s window, the same numbers its `zone stats` log lines carry. A load balancer picks the
// replica, so a caller asks a few times and keeps one answer per replica.
message ReplicaStats {
  string replica = 1;
  repeated ZoneStats zones = 2;
  // Messages realtime dropped since the replica started, by reason.
  Drops drops = 3;
}

message ZoneStats {
  string map = 1;
  uint32 phase = 2;
  uint32 local_players = 3;
  uint32 remote_players = 4;
  // Over the window: ticks run and zone events sent per tick (local and received).
  uint32 ticks = 5;
  double events_per_tick = 6;
  // Tick time (save + marshal + send), microseconds.
  uint32 tick_p50_us = 7;
  uint32 tick_p99_us = 8;
  // Bytes queued to the zone's local players per second, all of them together.
  uint64 bytes_per_second = 9;
  // NATS batches received from and published to the other replicas.
  uint32 batches_in = 10;
  uint32 batches_out = 11;
  // Corrections sent, and intents and chats dropped (rate, invalid), by the zone's players.
  uint32 corrections = 12;
  uint32 dropped_intents = 13;
  uint32 dropped_chats = 14;
  // Unix milliseconds the window ended.
  int64 at = 15;
}

message Drops {
  // Intents: over 20/s burst 40 (the connection is closed), over the size limit, or invalid.
  uint64 intent_rate = 1;
  uint64 intent_size = 2;
  uint64 intent_invalid = 3;
  // Chat: over 0.5/s burst 4, or not valid text.
  uint64 chat_rate = 4;
  uint64 chat_invalid = 5;
  // Connections closed because their send queue was full.
  uint64 slow_consumers = 6;
}
