syntax = "proto3";

// The species catalog: every Pokémon up to Gen 4, by national Pokédex number, with the facts the
// game plays by. Types, heights and weights were converted once from pokefirered (1-386) and
// pokeemerald-expansion (387-493) by infra/pokemon/catalog.mjs; the battle facts (base stats,
// abilities, growth, learnsets, …) by infra/battle/catalog.mjs from Showdown's Gen 4 data and
// both references. This file is the source now. Names, categories, descriptions, art and cries
// belong to each art style (tech-stack.md#decoupled-presentation); the FireRed one reads them by
// number at build time (make pokemon).
package pokeuniverse.species.v1;

import "google/protobuf/descriptor.proto";
import "pokeuniverse/ability/v1/catalog.proto";
import "pokeuniverse/pokemon/v1/pokemon.proto";
import "pokeuniverse/pokemon/v1/stats.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/species/v1;speciesv1";

// Gen 4's types, numbered as FireRed's TYPE_ constants plus one (MYSTERY is "???", Curse's type).
enum Type {
  TYPE_UNSPECIFIED = 0;
  TYPE_NORMAL = 1;
  TYPE_FIGHTING = 2;
  TYPE_FLYING = 3;
  TYPE_POISON = 4;
  TYPE_GROUND = 5;
  TYPE_ROCK = 6;
  TYPE_BUG = 7;
  TYPE_GHOST = 8;
  TYPE_STEEL = 9;
  TYPE_MYSTERY = 10;
  TYPE_FIRE = 11;
  TYPE_WATER = 12;
  TYPE_GRASS = 13;
  TYPE_ELECTRIC = 14;
  TYPE_PSYCHIC = 15;
  TYPE_ICE = 16;
  TYPE_DRAGON = 17;
  TYPE_DARK = 18;
}

// How fast a species gains levels (experience for each level), numbered as FireRed's GROWTH_ constants plus one.
enum GrowthRate {
  GROWTH_RATE_UNSPECIFIED = 0;
  GROWTH_RATE_MEDIUM_FAST = 1;
  GROWTH_RATE_ERRATIC = 2;
  GROWTH_RATE_FLUCTUATING = 3;
  GROWTH_RATE_MEDIUM_SLOW = 4;
  GROWTH_RATE_FAST = 5;
  GROWTH_RATE_SLOW = 6;
}

// A move learned by leveling up.
message LevelMove {
  uint32 level = 1;
  // A pokeuniverse.move.v1.Move number (the move catalog uses this file's Type, so it can't be imported here).
  uint32 move = 2;
}

// A species' facts, set on each Species value.
enum EvolutionMethod {
  EVOLUTION_METHOD_UNSPECIFIED = 0;
  // On levelling up.
  EVOLUTION_METHOD_LEVEL = 1;
  // With an item used on it (`item`).
  EVOLUTION_METHOD_ITEM = 2;
  // On being traded, holding `item` if set.
  EVOLUTION_METHOD_TRADE = 3;
  // Left behind by a level evolution when there's room in the party (Nincada's Shedinja).
  EVOLUTION_METHOD_SHED = 4;
}

enum EvolutionTime {
  EVOLUTION_TIME_UNSPECIFIED = 0;
  EVOLUTION_TIME_DAY = 1;
  EVOLUTION_TIME_NIGHT = 2;
}

// Tyrogue's: Attack against Defense.
enum EvolutionStats {
  EVOLUTION_STATS_UNSPECIFIED = 0;
  EVOLUTION_STATS_ATTACK_HIGHER = 1;
  EVOLUTION_STATS_EQUAL = 2;
  EVOLUTION_STATS_DEFENSE_HIGHER = 3;
}

// Wurmple's: the personality's upper half modulo 10, below 5 or not.
enum EvolutionPersonality {
  EVOLUTION_PERSONALITY_UNSPECIFIED = 0;
  EVOLUTION_PERSONALITY_LOW = 1;
  EVOLUTION_PERSONALITY_HIGH = 2;
}

// One way a species evolves: every condition set must hold. Numbers, as in LevelMove (those
// catalogs can't be imported here).
message Evolution {
  EvolutionMethod method = 1;
  // The species it becomes.
  uint32 species = 2;
  // LEVEL: at least this level.
  uint32 level = 3;
  // A pokeuniverse.item.v1.Item number: used (ITEM), held (LEVEL, TRADE) or spent from the bag (SHED).
  uint32 item = 4;
  pokeuniverse.pokemon.v1.Gender gender = 5;
  // At least this friendship.
  uint32 friendship = 6;
  EvolutionTime time = 7;
  // A pokeuniverse.move.v1.Move number it must know.
  uint32 move = 8;
  EvolutionStats stats = 9;
  EvolutionPersonality personality = 10;
  // A species number that must be in the party.
  uint32 party_species = 11;
}

message SpeciesInfo {
  Type type1 = 1;
  // The same as type1 for a single-typed species.
  Type type2 = 2;
  // In decimeters.
  uint32 height = 3;
  // In hectograms.
  uint32 weight = 4;
  pokeuniverse.pokemon.v1.Stats base_stats = 5;
  // One or two (Gen 4 has no hidden abilities); a Pokémon's personality picks between two.
  repeated pokeuniverse.ability.v1.Ability abilities = 6;
  // FireRed's gender threshold: 0 male only, 254 female only, 255 genderless; otherwise female when
  // the personality's low byte is below it (31: 12.5% female, 127: 50%).
  uint32 gender_ratio = 7;
  GrowthRate growth_rate = 8;
  // 3 (hardest) to 255.
  uint32 catch_rate = 9;
  // Base experience a defeated Pokémon gives (Gen 4).
  uint32 base_exp = 10;
  // EVs a defeated Pokémon gives.
  pokeuniverse.pokemon.v1.Stats ev_yield = 11;
  uint32 base_friendship = 12;
  // Gen 4's level-up learnset, by level (level 1 first).
  repeated LevelMove level_moves = 13;
  // In the order they're checked; the first that applies wins.
  repeated Evolution evolutions = 14;
  // pokeuniverse.move.v1.Move numbers it learns by TM or HM (Gen 3 or 4), and from a tutor. Moves,
  // not TM numbers: a TM's move is its ItemInfo.move.
  repeated uint32 machine_moves = 15;
  repeated uint32 tutor_moves = 16;
}

extend google.protobuf.EnumValueOptions {
  SpeciesInfo info = 50001;
}

