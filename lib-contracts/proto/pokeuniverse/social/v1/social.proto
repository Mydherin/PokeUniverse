syntax = "proto3";

// Social payloads (phase-9): the friends lists, sent as Protocol Buffers JSON over the HTTPS API,
// and the live changes, sent on the WebSocket (ServerMessage.social) and between mic-core replicas
// on each online player's NATS inbox, social.player.<id> (phase-9 D9).
package pokeuniverse.social.v1;

import "pokeuniverse/trainer/v1/trainer.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/social/v1;socialv1";

// Where a player is (phase-9 D7). Busy players can't be asked to trade, battle or join a room.
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_OFFLINE = 1;
  PRESENCE_ONLINE = 2;
  PRESENCE_BUSY_BATTLE = 3;
  PRESENCE_BUSY_TRADE = 4;
  PRESENCE_BUSY_LINK = 5;
}

// What the player is to another one (phase-9 M2's menu shows what fits).
enum Relation {
  RELATION_UNSPECIFIED = 0;
  RELATION_NONE = 1;
  RELATION_FRIEND = 2;
  // The player asked them; still pending.
  RELATION_REQUEST_SENT = 3;
  // They asked the player; ADD FRIEND accepts it (phase-9 D3).
  RELATION_REQUEST_RECEIVED = 4;
}

// A player as the social panel shows them.
message Friend {
  // The account ID (the same ID as OtherPlayer.id in the world).
  uint64 id = 1;
  string name = 2;
  pokeuniverse.trainer.v1.Gender gender = 3;
  // 0: the default face by gender; otherwise a stored face, /faces/<face>.png (phase-9 D6).
  uint32 face = 4;
  Presence presence = 5;
  // When OFFLINE: when they were last online, Unix seconds (0 = never seen).
  int64 last_seen = 6;
}

// A pending friend request: from the player in an incoming list, to them in an outgoing one.
message FriendRequest {
  Friend player = 1;
  // When it was sent, Unix seconds.
  int64 sent_at = 2;
}

// Response of GET /api/social/friends.
message FriendsList {
  repeated Friend friends = 1;
  repeated FriendRequest incoming = 2;
  repeated FriendRequest outgoing = 3;
}

// Body of POST /api/social/friends/requests.
message SendFriendRequest {
  uint64 id = 1;
}

// Response of POST /api/social/friends/requests: a pending request, or a friendship when the
// other player had already asked (phase-9 D3).
message SendFriendRequestResult {
  oneof result {
    FriendRequest request = 1;
    Friend friend = 2;
  }
}

enum RequestClosedReason {
  REQUEST_CLOSED_REASON_UNSPECIFIED = 0;
  // The receiver declined it.
  REQUEST_CLOSED_REASON_DECLINED = 1;
  // The sender cancelled it.
  REQUEST_CLOSED_REASON_CANCELLED = 2;
  // The receiver had 50 newer requests (phase-9 D3).
  REQUEST_CLOSED_REASON_DROPPED = 3;
}

// A request between the player and `id` is gone without a friendship.
message RequestClosed {
  uint64 id = 1;
  RequestClosedReason reason = 2;
}

message PresenceChanged {
  uint64 id = 1;
  Presence presence = 2;
  int64 last_seen = 3;
}

// A live social change for one player.
message SocialEvent {
  oneof event {
    // Someone asked to be friends.
    FriendRequest request_received = 1;
    // A request was accepted (either way): now friends.
    Friend friend_added = 2;
    RequestClosed request_closed = 3;
    // A friendship ended. Sent only to the player who removed it (their other replicas' view);
    // the other one isn't told (phase-9 D3).
    uint64 friend_removed = 4;
    PresenceChanged presence = 5;
    // A message in one of the player's conversations, the player's own included (phase-9 D9).
    ConversationMessage message = 6;
    // The player's SendMessage wasn't saved; sent only to the sender's connection.
    SendFailed send_failed = 7;
    // Phase-9 M6 (D16): an owner's invite to the receiver.
    ChannelInvite channel_invite = 8;
    // An invite is gone: accepted, declined (told to the owner and the invitee's other tabs) or
    // the channel deleted.
    ChannelInviteClosed channel_invite_closed = 9;
    // A channel the receiver belongs to changed: name, owner or member count.
    Channel channel_updated = 10;
    // Someone joined, left or was removed from a channel the receiver belongs to.
    ChannelMemberChanged channel_member = 11;
    // The receiver is no longer in the channel (left, removed or deleted).
    ChannelGone channel_gone = 12;
    // Phase-9 M8: the link rooms.
    LinkEvent link = 13;
  }
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  // One per friend pair, created on the first message (phase-9 D8).
  CONVERSATION_KIND_DIRECT = 1;
  // A private channel (phase-9 M6).
  CONVERSATION_KIND_CHANNEL = 2;
}

// A saved message (phase-9 D8). seq increases per conversation, with no gaps.
message ConversationMessage {
  uint64 conversation = 1;
  uint64 seq = 2;
  // The sender's account ID.
  uint64 sender = 3;
  string text = 4;
  // Unix milliseconds.
  int64 sent_at = 5;
  // The sender's SendMessage.client_id: set only for the sender, who matches it to its pending line.
  string client_id = 6;
  // Direct conversations: the other member, as the receiver sees it (0 for channels).
  uint64 friend = 7;
  // The sender's trainer name (a channel's lines come from players who may not be friends, M6).
  string sender_name = 8;
}

// Client -> server (WebSocket): a line for a conversation. FireRed's charset, 1-64 characters once
// trimmed, one rate budget with zone chat (phase-9 D8). Answered by the saved message on the
// sender's inbox, or SendFailed.
message SendMessage {
  // The conversation; 0 for a direct one not yet created, named by friend.
  uint64 conversation = 1;
  // Direct: the friend's account ID.
  uint64 friend = 2;
  string text = 3;
  // Chosen by the client per line; a retry with the same ID is saved once.
  string client_id = 4;
}

enum SendFailedReason {
  SEND_FAILED_REASON_UNSPECIFIED = 0;
  // Direct messages need a friendship (phase-9 D11); or not a member of the channel.
  SEND_FAILED_REASON_NOT_ALLOWED = 1;
  // Over the chat rate (phase-8 D17).
  SEND_FAILED_REASON_RATE = 2;
  // Not FireRed's charset, empty or too long.
  SEND_FAILED_REASON_INVALID = 3;
  // The server couldn't save it; try again.
  SEND_FAILED_REASON_ERROR = 4;
}

message SendFailed {
  string client_id = 1;
  SendFailedReason reason = 2;
}

// Client -> server (WebSocket): the player has read the conversation up to seq (phase-9 D10).
message MarkRead {
  uint64 conversation = 1;
  uint64 seq = 2;
}

// One of the player's conversations, in GET /api/social/conversations.
message Conversation {
  uint64 id = 1;
  ConversationKind kind = 2;
  // Direct: the other member.
  Friend friend = 3;
  uint64 last_seq = 4;
  uint64 last_read_seq = 5;
  // The last message (unset when none is left).
  ConversationMessage last = 6;
  // Set for a channel (phase-9 M6).
  Channel channel = 7;
}

// Response of GET /api/social/conversations, newest activity first.
message ConversationsList {
  repeated Conversation conversations = 1;
  // The receiver's pending channel invites (phase-9 M6).
  repeated ChannelInvite invites = 2;
}

// Response of GET /api/social/conversations/{id}/messages: oldest first. With ?before=<seq>, the 50
// before it (default: the newest 50); with ?after=<seq>, up to 50 after it.
message MessagesPage {
  repeated ConversationMessage messages = 1;
  // Older (before) or newer (after) messages remain.
  bool more = 2;
}

// A private channel (phase-9 D16). id is its conversation's ID.
message Channel {
  uint64 id = 1;
  string name = 2;
  uint64 owner = 3;
  uint32 members = 4;
}

message ChannelInvite {
  Channel channel = 1;
  // Who invited (the owner then).
  Friend from = 2;
  // Unix seconds.
  int64 sent_at = 3;
}

enum ChannelInviteClosedReason {
  CHANNEL_INVITE_CLOSED_REASON_UNSPECIFIED = 0;
  CHANNEL_INVITE_CLOSED_REASON_ACCEPTED = 1;
  CHANNEL_INVITE_CLOSED_REASON_DECLINED = 2;
  CHANNEL_INVITE_CLOSED_REASON_DELETED = 3;
}

message ChannelInviteClosed {
  uint64 channel = 1;
  // The invitee.
  uint64 player = 2;
  ChannelInviteClosedReason reason = 3;
}

enum ChannelMemberChange {
  CHANNEL_MEMBER_CHANGE_UNSPECIFIED = 0;
  CHANNEL_MEMBER_CHANGE_JOINED = 1;
  CHANNEL_MEMBER_CHANGE_LEFT = 2;
  CHANNEL_MEMBER_CHANGE_REMOVED = 3;
}

message ChannelMemberChanged {
  uint64 channel = 1;
  Friend player = 2;
  ChannelMemberChange change = 3;
}

message ChannelGone {
  uint64 channel = 1;
  // LEFT, REMOVED (by the owner) or, for a deleted channel, UNSPECIFIED.
  ChannelMemberChange change = 2;
}

message ChannelMember {
  Friend player = 1;
  // Unix seconds.
  int64 joined_at = 2;
}

// GET /api/social/channels/{id}/members: members (oldest first, the owner is Channel.owner) and,
// for the owner, the players invited.
message ChannelMembers {
  Channel channel = 1;
  repeated ChannelMember members = 2;
  repeated Friend invited = 3;
}

// POST /api/social/channels (create) and PATCH /api/social/channels/{id} (rename).
message ChannelName {
  string name = 1;
}

// POST /api/social/channels/{id}/invites: the friend's account ID.
message ChannelInviteRequest {
  uint64 id = 1;
}

// Phase-9 M8 (D18-D20): link rooms in a Pokémon Center 2F.

// What a link room is for (FireRed's Direct Corner choices).
enum LinkActivity {
  LINK_ACTIVITY_UNSPECIFIED = 0;
  LINK_ACTIVITY_TRADE = 1;
  LINK_ACTIVITY_SINGLE_BATTLE = 2;
  LINK_ACTIVITY_DOUBLE_BATTLE = 3;
  LINK_ACTIVITY_MULTI_BATTLE = 4;
}

// An open room: its leader and what it's for (Redis linkrooms:<map>:<phase>, D19).
message LinkRoom {
  Friend leader = 1;
  LinkActivity activity = 2;
  // Unix milliseconds.
  int64 opened_at = 3;
}

// Client -> server: the leader and member screens and the room (ClientMessage.link).
message LinkIntent {
  oneof intent {
    // BECOME LEADER: the room opens in the player's 2F zone.
    LinkActivity open = 1;
    // The leader cancels (B): the room closes.
    bool close = 2;
    // JOIN GROUP: the rooms in range, answered with LinkEvent.rooms; then live zone events.
    LinkActivity browse = 3;
    // The member asks this leader to join.
    uint64 join = 4;
    // The member stops waiting for the leader's answer (B).
    bool cancel_join = 5;
    // The leader answers the member who asked.
    AnswerJoin answer = 6;
    // The player walked through the door after LinkStart: warp into the room.
    bool enter = 7;
    // The player leaves the room (TradeCenter_ConfirmLeaveRoom YES): the link ends for both.
    bool leave = 8;
  }
}

message AnswerJoin {
  uint64 member = 1;
  bool accept = 2;
}

// Server -> client (and replica to replica on the player's inbox): SocialEvent.link.
message LinkEvent {
  oneof event {
    // The rooms in range, friends first, then by time opened.
    LinkRooms rooms = 1;
    // To the leader: a member asks to join.
    LinkMember join_asked = 2;
    // To the member: the leader's answer (or the room was gone).
    JoinAnswered join_answered = 3;
    // To both: accepted, walk in.
    LinkStart start = 4;
    // To both: the link ended; the player is back in front of the counter.
    bool ended = 5;
    // To the leader: the member who asked stopped waiting.
    uint64 join_cancelled = 6;
    // Replica to replica only: the partner left or dropped; end the link here too.
    uint64 partner_left = 7;
  }
}

message LinkRooms {
  repeated LinkRoom rooms = 1;
}

message LinkMember {
  Friend member = 1;
  LinkActivity activity = 2;
}

enum JoinRefusal {
  JOIN_REFUSAL_UNSPECIFIED = 0;
  // The leader said NO (gText_UR_OfferDeclined1).
  JOIN_REFUSAL_DECLINED = 1;
  // The room is gone or busy with another member.
  JOIN_REFUSAL_GONE = 2;
  // The room is for another activity (CableClub_Text_DifferentSelections).
  JOIN_REFUSAL_DIFFERENT = 3;
}

message JoinAnswered {
  uint64 leader = 1;
  bool accepted = 2;
  JoinRefusal refusal = 3;
}

message LinkStart {
  // The room's ID: the room map's private zone phase (D20).
  uint32 room = 1;
  // trade_center or battle_colosseum_2p.
  string map = 2;
  bool leader = 3;
  Friend partner = 4;
  LinkActivity activity = 5;
}
