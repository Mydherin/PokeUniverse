syntax = "proto3";

// Messages on the WebSocket between spa-pokeuniverse and mic-core.
// One envelope per direction; every message carries a sequence number.
package pokeuniverse.realtime.v1;

import "pokeuniverse/battle/v1/view.proto";
import "pokeuniverse/item/v1/bag.proto";
import "pokeuniverse/item/v1/pc.proto";
import "pokeuniverse/party/v1/box.proto";
import "pokeuniverse/party/v1/party.proto";
import "pokeuniverse/pokedex/v1/pokedex.proto";
import "pokeuniverse/world/v1/world.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/realtime/v1;realtimev1";

// Client -> server: intents only.
message ClientMessage {
  uint32 seq = 1;
  oneof payload {
    Authenticate authenticate = 2;
    Ping ping = 3;
    pokeuniverse.world.v1.EnterWorld enter_world = 4;
    pokeuniverse.world.v1.Move move = 5;
    pokeuniverse.world.v1.Turn turn = 6;
    pokeuniverse.world.v1.Interact interact = 7;
    pokeuniverse.world.v1.ScriptDone script_done = 8;
    pokeuniverse.item.v1.UseItem use_item = 9;
    pokeuniverse.item.v1.GiveItem give_item = 10;
    pokeuniverse.item.v1.TossItem toss_item = 11;
    pokeuniverse.item.v1.RegisterItem register_item = 12;
    pokeuniverse.item.v1.MoveItem move_item = 13;
    pokeuniverse.item.v1.WithdrawItem withdraw_item = 14;
    pokeuniverse.item.v1.DepositItem deposit_item = 15;
    pokeuniverse.item.v1.MovePcItem move_pc_item = 16;
    pokeuniverse.party.v1.SwapPartySlots swap_party_slots = 17;
    pokeuniverse.party.v1.GivePartyItem give_party_item = 18;
    pokeuniverse.party.v1.TakePartyItem take_party_item = 19;
    pokeuniverse.party.v1.SwapPokemonMoves swap_pokemon_moves = 20;
    pokeuniverse.battle.v1.BattleChoice battle_choice = 21;
    pokeuniverse.world.v1.ScriptBattle script_battle = 22;
    pokeuniverse.party.v1.EvolvePokemon evolve_pokemon = 23;
    pokeuniverse.party.v1.LearnMove learn_move = 24;
    pokeuniverse.world.v1.UseWarp use_warp = 25;
    pokeuniverse.party.v1.UsePartyItem use_party_item = 26;
    pokeuniverse.party.v1.UseFieldMove use_field_move = 27;
    pokeuniverse.party.v1.OpenBox open_box = 28;
    pokeuniverse.party.v1.MovePokemon move_pokemon = 29;
    pokeuniverse.party.v1.ReleasePokemon release_pokemon = 30;
    pokeuniverse.party.v1.RenameBox rename_box = 31;
    pokeuniverse.party.v1.SetBoxWallpaper set_box_wallpaper = 32;
    pokeuniverse.party.v1.SetMarkings set_markings = 33;
    pokeuniverse.party.v1.MoveHeldItem move_held_item = 34;
    pokeuniverse.party.v1.StoreHeldItem store_held_item = 35;
    pokeuniverse.party.v1.GiveHeldItem give_held_item = 36;
    pokeuniverse.party.v1.NameCaughtPokemon name_caught_pokemon = 37;
  }
}

// Server -> client: events.
message ServerMessage {
  uint32 seq = 1;
  oneof payload {
    Welcome welcome = 2;
    Pong pong = 3;
    Error error = 4;
    pokeuniverse.world.v1.WorldSnapshot snapshot = 5;
    pokeuniverse.world.v1.Correction correction = 6;
    pokeuniverse.world.v1.Script script = 7;
    pokeuniverse.item.v1.BagChanged bag_changed = 8;
    pokeuniverse.item.v1.ItemResult item_result = 9;
    pokeuniverse.item.v1.PcChanged pc_changed = 10;
    pokeuniverse.party.v1.PartyChanged party_changed = 11;
    pokeuniverse.battle.v1.BattleStarted battle_started = 12;
    pokeuniverse.battle.v1.BattleTurn battle_turn = 13;
    pokeuniverse.battle.v1.BattleEnded battle_ended = 14;
    pokeuniverse.party.v1.PokemonEvolved pokemon_evolved = 15;
    pokeuniverse.pokedex.v1.PokedexChanged pokedex_changed = 16;
    pokeuniverse.world.v1.Warped warped = 17;
    pokeuniverse.party.v1.LearnMoveResult learn_move_result = 18;
    pokeuniverse.party.v1.FieldMoveResult field_move_result = 19;
    pokeuniverse.party.v1.BoxView box_view = 20;
    pokeuniverse.world.v1.FollowerChanged follower_changed = 21;
  }
}

// First message after opening the socket, and again after every token refresh.
message Authenticate {
  string access_token = 1;
  // This copy of the game (random per page load): one copy plays a trainer at a time.
  string instance = 2;
}

// Reply to the first valid Authenticate.
message Welcome {
  reserved 2;
  reserved "playing_elsewhere";
  uint64 account_id = 1;
}

// Round-trip check.
message Ping {
  // Client clock, Unix milliseconds.
  uint64 client_time = 1;
}

message Pong {
  // Echo of Ping.client_time.
  uint64 client_time = 1;
  // Server clock, Unix milliseconds.
  uint64 server_time = 2;
}

message Error {
  ErrorCode code = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Missing or invalid access token.
  ERROR_CODE_UNAUTHENTICATED = 1;
  // Access token expired without a refresh.
  ERROR_CODE_TOKEN_EXPIRED = 2;
  // Message could not be decoded or is not allowed now.
  ERROR_CODE_BAD_MESSAGE = 3;
  // EnterWorld for an account with no trainer (New Game creates it).
  ERROR_CODE_NO_TRAINER = 4;
  // Another copy of the game entered the world with the trainer; this connection is closed.
  ERROR_CODE_REPLACED = 5;
  // EnterWorld without take_over (a reconnect) while another copy plays the trainer: this copy
  // was replaced meanwhile.
  ERROR_CODE_SESSION_ACTIVE = 6;
}
