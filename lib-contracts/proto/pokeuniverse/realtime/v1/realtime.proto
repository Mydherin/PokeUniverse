syntax = "proto3";

// Messages on the WebSocket between spa-pokeuniverse and mic-core.
// One envelope per direction; every message carries a sequence number.
package pokeuniverse.realtime.v1;

import "pokeuniverse/world/v1/world.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/realtime/v1;realtimev1";

// Client -> server: intents only.
message ClientMessage {
  uint32 seq = 1;
  oneof payload {
    Authenticate authenticate = 2;
    Ping ping = 3;
    pokeuniverse.world.v1.EnterWorld enter_world = 4;
    pokeuniverse.world.v1.Move move = 5;
    pokeuniverse.world.v1.Turn turn = 6;
    pokeuniverse.world.v1.Interact interact = 7;
    pokeuniverse.world.v1.ScriptDone script_done = 8;
  }
}

// Server -> client: events.
message ServerMessage {
  uint32 seq = 1;
  oneof payload {
    Welcome welcome = 2;
    Pong pong = 3;
    Error error = 4;
    pokeuniverse.world.v1.WorldSnapshot snapshot = 5;
    pokeuniverse.world.v1.Correction correction = 6;
    pokeuniverse.world.v1.Script script = 7;
  }
}

// First message after opening the socket, and again after every token refresh.
message Authenticate {
  string access_token = 1;
}

// Reply to the first valid Authenticate.
message Welcome {
  uint64 account_id = 1;
}

// Round-trip check.
message Ping {
  // Client clock, Unix milliseconds.
  uint64 client_time = 1;
}

message Pong {
  // Echo of Ping.client_time.
  uint64 client_time = 1;
  // Server clock, Unix milliseconds.
  uint64 server_time = 2;
}

message Error {
  ErrorCode code = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Missing or invalid access token.
  ERROR_CODE_UNAUTHENTICATED = 1;
  // Access token expired without a refresh.
  ERROR_CODE_TOKEN_EXPIRED = 2;
  // Message could not be decoded or is not allowed now.
  ERROR_CODE_BAD_MESSAGE = 3;
  // EnterWorld for an account with no trainer (New Game creates it).
  ERROR_CODE_NO_TRAINER = 4;
  // The account entered the world from another connection; this one is closed.
  ERROR_CODE_REPLACED = 5;
}
