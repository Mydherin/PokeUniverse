syntax = "proto3";

// The overworld on the WebSocket (inside pokeuniverse.realtime.v1's envelopes): the player's
// intents and the server's answers. The client predicts its own steps; mic-core checks every
// one and corrects the client when it disagrees (tech-stack.md#movement).
package pokeuniverse.world.v1;

import "pokeuniverse/battle/v1/view.proto";
import "pokeuniverse/item/v1/bag.proto";
import "pokeuniverse/map/v1/map.proto";
import "pokeuniverse/party/v1/party.proto";
import "pokeuniverse/pokedex/v1/pokedex.proto";
import "pokeuniverse/trainer/v1/trainer.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/world/v1;worldv1";

// Client -> server: put me in the world where my trainer is. Sent after Welcome, and again
// after every reconnect; answered with a WorldSnapshot, or Error NO_TRAINER, or Error
// SESSION_ACTIVE when another copy of the game plays the trainer and take_over isn't set.
message EnterWorld {
  // Entering from the game (CONTINUE, New Game): plays here, disconnecting any other copy of the
  // game. False when re-entering after a reconnect, so a copy that was replaced meanwhile gets
  // SESSION_ACTIVE instead of taking the trainer back.
  bool take_over = 1;
}

// One step, as the client predicted it.
message Move {
  // Client step counter, echoed by a Correction.
  uint32 step = 1;
  pokeuniverse.map.v1.Direction direction = 2;
  // B held: running, when the snapshot allows it.
  bool run = 3;
  // The tile the step starts from; a step from anywhere else is ignored.
  uint32 x = 4;
  uint32 y = 5;
}

// Face a direction without moving: turning in place, or bumping into something.
message Turn {
  pokeuniverse.map.v1.Direction direction = 1;
}

// Standing on a warp and going its way (the stairs): the client plays the transition at once and
// waits for Warped; a refused warp is answered with a Correction.
message UseWarp {
  pokeuniverse.map.v1.Direction direction = 1;
  // The tile the player stands on; a warp from anywhere else is ignored.
  uint32 x = 2;
  uint32 y = 3;
}

// A button: check what the player faces. Always answered with a Script (empty when nothing
// answers); the client waits for it before moving again.
message Interact {
  // Not A: the player walked up to a signpost (FireRed reads it without pressing A); only
  // signs on signpost tiles answer.
  bool walk_into = 1;
}

// The client finished showing a Script; the player can move again.
message ScriptDone {
  uint32 script = 1;
}

// Server -> client: where the player is, on entering the world (and after reconnecting).
message WorldSnapshot {
  // A map of lib-maps.
  string map = 1;
  Avatar player = 2;
  // Whether B makes the player run here (the map allows it and the trainer has the Running Shoes).
  bool can_run = 3;
  // How long the trainer has played, up to 999:59:59; the client counts on from it.
  uint32 play_time_seconds = 4;
  // What the trainer carries.
  pokeuniverse.item.v1.Bag bag = 5;
  // The trainer's Pokédex.
  pokeuniverse.pokedex.v1.Pokedex pokedex = 6;
  // The trainer's Pokémon.
  pokeuniverse.party.v1.Party party = 7;
  // The battle the trainer is in, if any: the client redraws it (phase-5, Resume).
  pokeuniverse.battle.v1.BattleView battle = 8;
  // The other players in the zone (same map and phase), never the player itself.
  repeated OtherPlayer others = 9;
}

message Avatar {
  uint32 x = 1;
  uint32 y = 2;
  pokeuniverse.map.v1.Direction facing = 3;
  pokeuniverse.trainer.v1.Gender gender = 4;
  // The Pokémon walking behind the trainer; unset when there is none.
  Follower follower = 5;
}

// The Pokémon that follows the trainer, as in HeartGold and SoulSilver: the first party Pokémon that
// isn't fainted (the first one if all are). It steps onto the tile the player left, at the player's speed.
message Follower {
  // National Pokédex number.
  uint32 species = 1;
  bool shiny = 2;
  uint32 x = 3;
  uint32 y = 4;
  pokeuniverse.map.v1.Direction facing = 5;
  // On the player's own tile (entering the world, after a warp): not drawn until the player's next step.
  bool hidden = 6;
}

// Server -> client: the follower changed (the party changed): another Pokémon, or none (unset).
message FollowerChanged {
  Follower follower = 1;
}

// The server refused a predicted step: where the player really is. The client goes back there;
// steps it sent before receiving this are ignored.
// Server -> client: the warp was saved: the player is on another map. Everything else the client
// knows of the trainer stays as it is.
message Warped {
  // A map of lib-maps.
  string map = 1;
  uint32 x = 2;
  uint32 y = 3;
  pokeuniverse.map.v1.Direction facing = 4;
  bool can_run = 5;
  // On the player's tile, hidden; unset when there is none.
  Follower follower = 6;
  // The other players in the new zone, never the player itself.
  repeated OtherPlayer others = 7;
}

// Another player in the same zone (map and phase), as the others see it.
message OtherPlayer {
  // The trainer's ID.
  uint64 id = 1;
  string name = 2;
  pokeuniverse.trainer.v1.Gender gender = 3;
  uint32 x = 4;
  uint32 y = 5;
  pokeuniverse.map.v1.Direction facing = 6;
  // Unset when there is none.
  Follower follower = 7;
  bool in_battle = 8;
}

// Server -> client: what changed in the zone during one tick, in order. Encoded once per zone and
// sent as the same bytes to every player in it.
message ZoneEvents {
  repeated ZoneEvent events = 1;
}

message ZoneEvent {
  oneof event {
    PlayerJoined joined = 1;
    PlayerLeft left = 2;
    PlayerMoved moved = 3;
    PlayerTurned turned = 4;
    PlayerFollower follower = 5;
    PlayerBattle battle = 6;
  }
}

// A player entered the zone (entered the world, warped in, reconnected).
message PlayerJoined {
  OtherPlayer player = 1;
}

// A player left the zone (warped out, disconnected).
message PlayerLeft {
  uint64 id = 1;
}

// A player took an accepted step to (x, y).
message PlayerMoved {
  uint64 id = 1;
  uint32 x = 2;
  uint32 y = 3;
  pokeuniverse.map.v1.Direction facing = 4;
  bool run = 5;
}

// A player turned in place.
message PlayerTurned {
  uint64 id = 1;
  pokeuniverse.map.v1.Direction facing = 2;
}

// A player's follower changed: another Pokémon, or none (unset).
message PlayerFollower {
  uint64 id = 1;
  Follower follower = 2;
}

// A player entered or left a battle.
message PlayerBattle {
  uint64 id = 1;
  bool in_battle = 2;
}

message Correction {
  // The refused step.
  uint32 step = 1;
  uint32 x = 2;
  uint32 y = 3;
  pokeuniverse.map.v1.Direction facing = 4;
  // Where the follower really is; unset when there is none.
  Follower follower = 5;
}

// What an interaction runs, step by step. When it has steps, the player can't move until the
// client sends ScriptDone with its id.
message Script {
  uint32 id = 1;
  repeated ScriptStep steps = 2;
  // The NPC (ClientNpc.id) that answers: it turns to face the player (faceplayer).
  string npc = 3;
}

message ScriptStep {
  oneof action {
    // Text in the message box, waiting for A or B.
    Message message = 1;
    // A sound effect, by ID.
    string sound = 2;
    // The PC the player faces turns on (flickering, while the script goes on) or off.
    PcScreen pc_screen = 3;
    // The player's PC menu; the script goes on once the player turns it off.
    PlayersPc players_pc = 4;
    // A YES/NO menu over the last message (YesNoBox). YES goes on with the next step.
    YesNo yes_no = 5;
    // A trainer battle: the client sends ScriptBattle and waits for BattleStarted. After a
    // win the script goes on once BattleEnded is shown; a loss (whiteout) ends it there.
    TrainerBattle trainer_battle = 6;
    // A song on the BGM player, by ID (a trainer's encounter music); the map's comes back once
    // the script ends.
    string music = 7;
    // The NPC that answers turns back to where it faced as the map loaded (true).
    bool face_original = 8;
    // A wild battle mic-core started on a step or with Sweet Scent (true): the client sends
    // ScriptBattle and waits for BattleStarted, as for a trainer battle; mic-core holds the wild Pokémon.
    bool wild_battle = 9;
  }
}

message YesNo {
  // What NO shows; the script ends after them.
  repeated ScriptStep no = 1;
}

message TrainerBattle {
  // A trainer of mic-core's trainer table.
  string trainer = 1;
}

// The client reached the running script's TrainerBattle or WildBattle step: the battle starts.
message ScriptBattle {
  uint32 script = 1;
}

// AnimatePcTurnOn and AnimatePcTurnOff: the screen of the PC the player faces.
message PcScreen {
  Pc pc = 1;
  bool on = 2;
}

enum Pc {
  PC_UNSPECIFIED = 0;
  // The PC in the player's room.
  PC_PLAYERS = 1;
}

// BedroomPC: ITEM STORAGE (withdraw and deposit, pokeuniverse.item.v1's pc.proto), MAILBOX and
// TURN OFF.
message PlayersPc {
  // What the PC stores as it turns on; later changes come as PcChanged.
  repeated pokeuniverse.item.v1.BagSlot items = 1;
}

message Message {
  // Text ID; each art style maps it to its own text (tech-stack.md#decoupled-presentation).
  string text = 1;
  // Read from a signpost: drawn in the signpost frame.
  bool sign = 2;
}

// mic-core -> every mic-core (NATS subject world.sessions.taken): a copy of the game took the
// trainer over; the replica holding connection `conn` disconnects it.
message SessionTaken {
  uint64 account_id = 1;
  string conn = 2;
}

// mic-core -> the same zone on every other mic-core (NATS subject world.zone.<map>.<phase>, phase-8
// D2): what one replica's zone tells the others. Never sent to the client.
message ZoneBus {
  // The publishing replica; its own messages are skipped.
  string replica = 1;
  oneof message {
    // The events of the replica's own players during one tick, in order (only when non-empty).
    ZoneEvents batch = 2;
    // Every 5 s while the zone has players there: who they are.
    ZonePresence presence = 3;
  }
}

// The players a replica holds in the zone (the beat).
message ZonePresence {
  repeated uint64 ids = 1;
}

// A player in a zone as stored in Redis (hash zone:<map>:<phase>, phase-8 D3): what a player
// entering reads to draw the others, and the replica that holds them.
message ZoneMember {
  string replica = 1;
  OtherPlayer player = 2;
}
