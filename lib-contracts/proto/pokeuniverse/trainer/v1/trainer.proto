syntax = "proto3";

// Trainer payloads, sent as Protocol Buffers JSON over the HTTPS API.
package pokeuniverse.trainer.v1;

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/trainer/v1;trainerv1";

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_BOY = 1;
  GENDER_GIRL = 2;
}

// Response of GET /api/trainer: what the main menu's CONTINUE window and the Trainer Card show,
// and where the game continues.
message TrainerSummary {
  string name = 1;
  Gender gender = 2;
  uint32 play_time_seconds = 3;
  uint32 badges = 4;
  // Pokémon caught; unset until the player has the Pokédex.
  optional uint32 pokedex_caught = 5;
  Location location = 6;
  // The ID No. on the Trainer Card: the public half (low 16 bits) of the trainer ID.
  uint32 id_no = 7;
  // ¥0 to ¥999999.
  uint32 money = 8;
  Options options = 9;
}

// Where the trainer is: a map of lib-maps and a tile on it.
message Location {
  string map = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// The OPTION menu's choices, saved per trainer; New Game resets them to FireRed's defaults
// (MID, ON, SHIFT, MONO, HELP, TYPE1). Request of PUT /api/trainer/options, where every field
// must be set.
message Options {
  TextSpeed text_speed = 1;
  BattleScene battle_scene = 2;
  BattleStyle battle_style = 3;
  SoundMode sound = 4;
  ButtonMode button_mode = 5;
  // The window frame: 1 to 10 (TYPE1 to TYPE10).
  uint32 frame = 6;
}

enum TextSpeed {
  TEXT_SPEED_UNSPECIFIED = 0;
  TEXT_SPEED_SLOW = 1;
  TEXT_SPEED_MID = 2;
  TEXT_SPEED_FAST = 3;
}

enum BattleScene {
  BATTLE_SCENE_UNSPECIFIED = 0;
  BATTLE_SCENE_ON = 1;
  BATTLE_SCENE_OFF = 2;
}

enum BattleStyle {
  BATTLE_STYLE_UNSPECIFIED = 0;
  BATTLE_STYLE_SHIFT = 1;
  BATTLE_STYLE_SET = 2;
}

enum SoundMode {
  SOUND_MODE_UNSPECIFIED = 0;
  SOUND_MODE_MONO = 1;
  SOUND_MODE_STEREO = 2;
}

enum ButtonMode {
  BUTTON_MODE_UNSPECIFIED = 0;
  // The help bar under menus and the help system on L and R.
  BUTTON_MODE_HELP = 1;
  // L and R switch pages in some menus.
  BUTTON_MODE_LR = 2;
  // L works as A.
  BUTTON_MODE_L_EQUALS_A = 3;
}

// Request of PUT /api/trainer: the trainer New Game creates at the end of Oak's speech.
// It replaces the account's trainer, as starting a new game replaces the save.
message NewTrainer {
  Gender gender = 1;
  // 1 to 7 characters of the naming screen's keyboard, not only spaces.
  string name = 2;
  string rival_name = 3;
}
