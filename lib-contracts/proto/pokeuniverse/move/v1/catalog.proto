  MOVE_POUND = 1 [(info) = {type: TYPE_NORMAL, category: CATEGORY_PHYSICAL, power: 40, accuracy: 100, pp: 35, target: TARGET_NORMAL, flags: [MOVE_FLAG_CONTACT, MOVE_FLAG_METRONOME, MOVE_FLAG_MIRROR, MOVE_FLAG_PROTECT]}];
