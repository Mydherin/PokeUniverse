syntax = "proto3";

// The move catalog: every move up to Gen 4, by its number in the games, with the rules mic-core,
// mic-battles and the client read. Converted once by infra/battle/catalog.mjs from Showdown's Gen 4
// data (@pkmn/sim) with FireRed's constant names for 1-354 and pokeemerald-expansion's for 355-467;
// this file is the source now. Names, descriptions and animations belong to each art style
// (tech-stack.md#decoupled-presentation); the FireRed one reads them by number at build time.
package pokeuniverse.move.v1;

import "google/protobuf/descriptor.proto";
import "pokeuniverse/species/v1/catalog.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/move/v1;movev1";

// Gen 4's split: each move is physical or special by itself, not by its type.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_PHYSICAL = 1;
  CATEGORY_SPECIAL = 2;
  CATEGORY_STATUS = 3;
}

// Who a move can hit.
enum Target {
  TARGET_UNSPECIFIED = 0;
  // One adjacent Pokémon the user picks.
  TARGET_NORMAL = 1;
  // The user.
  TARGET_SELF = 2;
  // An adjacent ally.
  TARGET_ADJACENT_ALLY = 3;
  // The user or an adjacent ally.
  TARGET_ADJACENT_ALLY_OR_SELF = 4;
  // One adjacent foe the user picks.
  TARGET_ADJACENT_FOE = 5;
  // Every adjacent Pokémon, allies included.
  TARGET_ALL_ADJACENT = 6;
  // Every adjacent foe.
  TARGET_ALL_ADJACENT_FOES = 7;
  // The user and its allies.
  TARGET_ALLIES = 8;
  // The user's side of the field.
  TARGET_ALLY_SIDE = 9;
  // The user's whole party.
  TARGET_ALLY_TEAM = 10;
  // Any other Pokémon, even far away.
  TARGET_ANY = 11;
  // The foes' side of the field.
  TARGET_FOE_SIDE = 12;
  // A random adjacent foe.
  TARGET_RANDOM_NORMAL = 13;
  // Decided by the move (e.g. Counter: whoever last hit the user).
  TARGET_SCRIPTED = 14;
  // The whole field.
  TARGET_ALL = 15;
}

enum MoveFlag {
  MOVE_FLAG_UNSPECIFIED = 0;
  // Animated against an ally.
  MOVE_FLAG_ALLYANIM = 1;
  // Biting (Strong Jaw).
  MOVE_FLAG_BITE = 2;
  // Ball or bomb (Bulletproof).
  MOVE_FLAG_BULLET = 3;
  // Hits through a Substitute.
  MOVE_FLAG_BYPASSSUB = 4;
  // Charges on the first turn.
  MOVE_FLAG_CHARGE = 5;
  // Makes contact (Rough Skin, Static, …).
  MOVE_FLAG_CONTACT = 6;
  // A dance (Dancer).
  MOVE_FLAG_DANCE = 7;
  // Thaws the user out.
  MOVE_FLAG_DEFROST = 8;
  // Reaches any Pokémon in triple battles.
  MOVE_FLAG_DISTANCE = 9;
  // Can't be called by Copycat.
  MOVE_FLAG_FAILCOPYCAT = 10;
  // Encore fails on it.
  MOVE_FLAG_FAILENCORE = 11;
  // Fails with Instruct.
  MOVE_FLAG_FAILINSTRUCT = 12;
  // Fails with Me First.
  MOVE_FLAG_FAILMEFIRST = 13;
  // Can't be copied by Mimic.
  MOVE_FLAG_FAILMIMIC = 14;
  // Hits a few turns later.
  MOVE_FLAG_FUTUREMOVE = 15;
  // Can't be used under Gravity.
  MOVE_FLAG_GRAVITY = 16;
  // Heals (blocked by Heal Block).
  MOVE_FLAG_HEAL = 17;
  // Can be called by Metronome.
  MOVE_FLAG_METRONOME = 18;
  // Double damage against a Minimized target (Stomp).
  MOVE_FLAG_MINIMIZE = 19;
  // Can be copied by Mirror Move.
  MOVE_FLAG_MIRROR = 20;
  // Pressure takes PP even when it doesn't target the holder.
  MOVE_FLAG_MUSTPRESSURE = 21;
  // Can't be called by Assist.
  MOVE_FLAG_NOASSIST = 22;
  // Fails in Sky Battles.
  MOVE_FLAG_NONSKY = 23;
  // Hits once with Parental Bond.
  MOVE_FLAG_NOPARENTALBOND = 24;
  // Can't be copied by Sketch.
  MOVE_FLAG_NOSKETCH = 25;
  // Can't be called by Sleep Talk.
  MOVE_FLAG_NOSLEEPTALK = 26;
  // Powder (Grass types are immune since Gen 6).
  MOVE_FLAG_POWDER = 27;
  // Blocked by Protect and Detect.
  MOVE_FLAG_PROTECT = 28;
  // A pulse (Mega Launcher).
  MOVE_FLAG_PULSE = 29;
  // Punching (Iron Fist).
  MOVE_FLAG_PUNCH = 30;
  // The user must recharge next turn.
  MOVE_FLAG_RECHARGE = 31;
  // Bounced back by Magic Coat.
  MOVE_FLAG_REFLECTABLE = 32;
  // Slicing (Sharpness).
  MOVE_FLAG_SLICING = 33;
  // Stolen by Snatch.
  MOVE_FLAG_SNATCH = 34;
  // Sound-based (Soundproof).
  MOVE_FLAG_SOUND = 35;
  // Wind (Wind Rider).
  MOVE_FLAG_WIND = 36;
}

// A move's rules, set on each Move value.
message MoveInfo {
  pokeuniverse.species.v1.Type type = 1;
  Category category = 2;
  // 0 for status moves and moves whose power varies (Low Kick, Return, …).
  uint32 power = 3;
  // Percent; 0 never misses.
  uint32 accuracy = 4;
  uint32 pp = 5;
  // -7 to +5: higher moves first.
  int32 priority = 6;
  Target target = 7;
  repeated MoveFlag flags = 8;
  // Percent chance of the secondary effect (Flamethrower's burn: 10); 0 when it has none or always.
  uint32 effect_chance = 9;
  // Extra critical-hit stages (Slash: 1).
  uint32 crit_stage = 10;
}

extend google.protobuf.EnumValueOptions {
  MoveInfo info = 50002;
}

