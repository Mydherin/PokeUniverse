syntax = "proto3";

// The item catalog: every FireRed item, by FireRed's item ID, and Gen 4's after them, with the rules
// mic-core plays them by and the client builds its menus from. Converted once from pokefirered's
// src/data/items.json (Gen 4's by infra/battle/items.mjs); this file is the source now. Names, descriptions and icons belong to each art style
// (tech-stack.md#decoupled-presentation): the FireRed one reads them by ID at build time.
package pokeuniverse.item.v1;

import "google/protobuf/descriptor.proto";
import "pokeuniverse/move/v1/catalog.proto";
import "pokeuniverse/pokemon/v1/pokemon.proto";
import "pokeuniverse/pokemon/v1/stats.proto";

option go_package = "pokeuniverse/lib-contracts/gen/go/pokeuniverse/item/v1;itemv1";

// Where an item goes: the BAG's pockets, the TM CASE and the BERRY POUCH.
enum Pocket {
  POCKET_UNSPECIFIED = 0;
  POCKET_ITEMS = 1;
  POCKET_KEY_ITEMS = 2;
  POCKET_POKE_BALLS = 3;
  POCKET_TM_CASE = 4;
  POCKET_BERRY_POUCH = 5;
}

// What USE (CHECK, OPEN) does outside battle. Unspecified: nothing (the item has no USE).
enum FieldUse {
  FIELD_USE_UNSPECIFIED = 0;
  // "This isn't the time to use that!"
  FIELD_USE_NOT_NOW = 1;
  // On a party Pokémon (they need one): HP and status, PP, PP Up, Rare Candy, evolution, Sacred Ash, Enigma Berry.
  FIELD_USE_MEDICINE = 2;
  FIELD_USE_ETHER = 3;
  FIELD_USE_PP_UP = 4;
  FIELD_USE_RARE_CANDY = 5;
  FIELD_USE_EVOLUTION_ITEM = 6;
  FIELD_USE_SACRED_ASH = 7;
  FIELD_USE_ENIGMA_BERRY = 8;
  // CHECK: reads the mail.
  FIELD_USE_MAIL = 9;
  // Rides (where the map allows cycling).
  FIELD_USE_BIKE = 10;
  // Fishes (facing water).
  FIELD_USE_ROD = 11;
  // Looks for hidden items around the player, back on the field.
  FIELD_USE_ITEMFINDER = 12;
  // Shows the trainer's coins.
  FIELD_USE_COIN_CASE = 13;
  // Shows the trainer's berry powder.
  FIELD_USE_POWDER_JAR = 14;
  // Wakes sleeping party Pokémon, or plays a catchy tune.
  FIELD_USE_POKE_FLUTE = 15;
  // Keeps weak wild Pokémon away for `param` steps; used up.
  FIELD_USE_REPEL = 16;
  // WHITE FLUTE lures wild Pokémon, BLACK FLUTE repels them.
  FIELD_USE_BLACK_WHITE_FLUTE = 17;
  // Escapes a cave or dungeon (where the map allows it); used up.
  FIELD_USE_ESCAPE_ROPE = 18;
  // Screens the item opens.
  FIELD_USE_TOWN_MAP = 19;
  FIELD_USE_FAME_CHECKER = 20;
  // Recharges to rebattle trainers (on routes and in towns).
  FIELD_USE_VS_SEEKER = 21;
  FIELD_USE_TM_CASE = 22;
  FIELD_USE_BERRY_POUCH = 23;
  FIELD_USE_TEACHY_TV = 24;
  // TMs and HMs: teaches the move to a party Pokémon (the party menu).
  FIELD_USE_TM_HM = 25;
}

// How BAG uses an item in battle (phase-5 M12). Unspecified: it can't be ("This isn't the time...").
enum BattleUse {
  BATTLE_USE_UNSPECIFIED = 0;
  // On a party Pokémon the player chooses.
  BATTLE_USE_PARTY = 1;
  // On one move of a party Pokémon the player chooses.
  BATTLE_USE_MOVE = 2;
  // On the Pokémon in battle or its side, with no choice (X items, Dire Hit, Guard Spec., POKé FLUTE).
  BATTLE_USE_SELF = 3;
  // Thrown: a trainer blocks it, and it's spent all the same.
  BATTLE_USE_BALL = 4;
}

// What using an item does to its target: the one table mic-battles plays and the client checks.
message ItemEffect {
  // HP restored: a fixed amount, or a percentage of the max (100: all of it).
  uint32 hp = 1;
  uint32 hp_percent = 2;
  repeated pokeuniverse.pokemon.v1.Status cures = 3;
  bool confusion = 4;
  bool infatuation = 5;
  // Only on a fainted Pokémon, which it brings back with `hp_percent`.
  bool revive = 6;
  // PP restored: a fixed amount or all of it, on the move chosen or on all of them.
  uint32 pp = 7;
  bool pp_max = 8;
  bool all_moves = 9;
  // Vitamins: 10 EVs in this stat, up to 100 from items.
  pokeuniverse.pokemon.v1.Stat ev_stat = 10;
  // PP UP: the chosen move's PP up by a fifth of its base, three times at most; PP MAX: all three.
  bool pp_up = 11;
  bool pp_max_up = 12;
  // SACRED ASH: on every Pokémon of the party it can work on.
  bool all_party = 13;
  // Friendship change when it works: below 100, below 200, from 200 (ITEM5_FRIENDSHIP_*).
  repeated sint32 friendship = 14;
  // Not spent (the BLUE FLUTE outside battle, an HM).
  bool reusable = 15;
}

// An item's rules, set on each Item value.
message ItemInfo {
  Pocket pocket = 1;
  // Buying price at a Poké Mart (selling: half); 0 can't be sold.
  uint32 price = 2;
  // Key items and HMs: one at most, never tossed, held or sold; no quantity shown.
  bool important = 3;
  // Can be registered to SELECT.
  bool registrable = 4;
  FieldUse field_use = 5;
  // Used on a party Pokémon: with none, "There is no POKéMON."
  bool party = 6;
  // FIELD_USE_REPEL: steps it lasts.
  uint32 param = 7;
  // TMs and HMs: the move they teach (FireRed's sTMHMMoves).
  pokeuniverse.move.v1.Move move = 8;
  BattleUse battle_use = 9;
  ItemEffect effect = 10;
}

extend google.protobuf.EnumValueOptions {
  ItemInfo info = 50000;
}

