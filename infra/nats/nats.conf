# NATS: messaging between microservices only. Players never connect here.
port: 4222
http_port: 8222

# Messages are in transit only: no JetStream, no persistence.
max_payload: 1MB

# One user per microservice (tech-stack.md#across-microservices).
authorization {
  users = [
    { user: mic-core, password: $NATS_MIC_CORE_PASSWORD }
  ]
}
